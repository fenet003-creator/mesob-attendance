<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .login-footer { margin-top: 1.5rem; text-align: center; }
    .login-footer a { color: var(--gold, #b8860b); font-weight: 600; }
    .login-footer a:hover { text-decoration: underline; }
    .login-footer p { font-size: 0.8rem; color: var(--ink-muted, #7a7a8e); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <h1>BG Mesob</h1>
        <p>Internship Attendance Platform</p>
      </div>
      <div id="alert"></div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username" maxlength="100">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password" maxlength="255">
          <div style="text-align:right;margin-top:0.35rem;"><a href="/forgot-password" style="font-size:0.78rem;color:var(--ink-muted);font-weight:600;">Forgot password?</a></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
      </form>
      <div id="resendBox" style="display:none;text-align:center;margin-top:1rem;font-size:0.8rem;">
        <a href="#" id="resendLink" style="color:var(--gold);font-weight:600;">Resend verification email</a>
        <span id="resendMsg" style="display:none;margin-left:0.5rem;color:var(--green);"></span>
      </div>
      <div class="login-footer">
        <p>Don't have an account? <a href="/signup">Apply for Internship</a></p>
        <p>&copy; 2026 BG Mesob. All rights reserved.</p>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    function getDashboardPath(role) {
      if (role === 'admin') return '/admin/dashboard.html';
      if (role === 'supervisor') return '/supervisor/dashboard.html';
      return '/intern/dashboard.html';
    }

    const user = getUser();
    if (user && getToken()) {
      window.location.href = getDashboardPath(user.role);
    }

    document.getElementById('resendLink').addEventListener('click', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const msg = document.getElementById('resendMsg');
      if (!username) { msg.textContent = 'Enter your username first'; msg.style.display = 'inline'; return; }
      msg.textContent = 'Sending…'; msg.style.display = 'inline';
      try {
        const data = await apiRequest('/auth/resend-verification', { method: 'POST', body: JSON.stringify(username.includes('@') ? { email: username } : { username }) });
        msg.textContent = data.message;
        msg.style.color = 'var(--green)';
      } catch (err) { msg.textContent = err.message; msg.style.color = 'var(--red)'; }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const alertEl = document.getElementById('alert');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner spinner-sm"></span> Signing in\u2026';
      alertEl.style.display = 'none';

      try {
        const data = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        setAuth(data.token, data.user);
        window.location.href = getDashboardPath(data.user.role);
      } catch (err) {
        showAlert(alertEl, err.message);
        // Show resend link if verification error
        if (err.message.toLowerCase().includes('verify your email')) {
          document.getElementById('resendBox').style.display = 'block';
        }
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
