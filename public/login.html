<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BG Mesob Attendance</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo-badge">BG Mesob</div>
      <h1>Attendance System</h1>
      <p class="subtitle">Sign in to manage or record internship attendance</p>
      <div id="alert"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter username" maxlength="100">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password" maxlength="255">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const user = getUser();
    if (user && getToken()) {
      window.location.href = user.role === 'admin' ? '/admin/dashboard.html' : '/intern/dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const alert = document.getElementById('alert');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const data = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        setAuth(data.token, data.user);
        window.location.href = data.user.role === 'admin'
          ? '/admin/dashboard.html'
          : '/intern/dashboard.html';
      } catch (err) {
        showAlert(alert, err.message);
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
