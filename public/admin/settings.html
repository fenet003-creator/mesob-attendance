<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h1>Settings</h1>
      </div>

      <div class="card" style="max-width: 480px;">
        <h2>Attendance Rules</h2>
        <p style="color: var(--gray-500); font-size: 0.875rem; margin-bottom: 1.25rem;">
          Configure the daily time boundaries used to mark interns as Present, Late, or Absent.
        </p>
        <div id="rulesAlert"></div>
        <form id="rulesForm">
          <div class="form-group">
            <label>Work Start Time</label>
            <input type="time" id="work_start_time" required>
            <small style="color: var(--gray-500);">Informational — when the workday begins</small>
          </div>
          <div class="form-group">
            <label>Late Threshold (Present → Late)</label>
            <input type="time" id="late_threshold" required>
            <small style="color: var(--gray-500);">Check-in before this time = Present</small>
          </div>
          <div class="form-group">
            <label>Absent Threshold (Late → Absent)</label>
            <input type="time" id="absent_threshold" required>
            <small style="color: var(--gray-500);">Check-in after this time = Absent</small>
          </div>
          <button type="submit" class="btn btn-primary">Save Rules</button>
        </form>
      </div>

      <div class="card" style="max-width: 480px;">
        <h2>Change Password</h2>
        <div id="passwordAlert"></div>
        <form id="passwordForm">
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="currentPassword" required>
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" required minlength="6">
            <small style="color: var(--gray-500);">Minimum 6 characters</small>
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script>
    requireAuth('admin');
    document.getElementById('sidebar').innerHTML = renderSidebar('admin', 'settings');

    async function loadSettings() {
      try {
        const s = await apiRequest('/settings');
        document.getElementById('work_start_time').value = s.work_start_time || '08:00';
        document.getElementById('late_threshold').value = s.late_threshold || '08:15';
        document.getElementById('absent_threshold').value = s.absent_threshold || '08:30';
      } catch (err) {
        showAlert(document.getElementById('rulesAlert'), err.message);
      }
    }

    document.getElementById('rulesForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('rulesAlert');
      const workStart = document.getElementById('work_start_time').value;
      const lateThreshold = document.getElementById('late_threshold').value;
      const absentThreshold = document.getElementById('absent_threshold').value;

      if (lateThreshold <= workStart) {
        showAlert(alert, 'Late threshold must be after work start time');
        return;
      }
      if (absentThreshold <= lateThreshold) {
        showAlert(alert, 'Absent threshold must be after late threshold');
        return;
      }

      try {
        await apiRequest('/settings', {
          method: 'PUT',
          body: JSON.stringify({ work_start_time: workStart, late_threshold: lateThreshold, absent_threshold: absentThreshold }),
        });
        showAlert(alert, 'Attendance rules updated successfully', 'success');
      } catch (err) {
        showAlert(alert, err.message);
      }
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('passwordAlert');
      const newPass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (newPass !== confirm) {
        showAlert(alert, 'Passwords do not match');
        return;
      }

      try {
        await apiRequest('/auth/change-password', {
          method: 'POST',
          body: JSON.stringify({
            currentPassword: document.getElementById('currentPassword').value,
            newPassword: newPass,
          }),
        });
        showAlert(alert, 'Password updated successfully', 'success');
        document.getElementById('passwordForm').reset();
      } catch (err) {
        showAlert(alert, err.message);
      }
    });

    loadSettings();
  </script>
</body>
</html>
