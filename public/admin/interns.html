<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Interns - BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h1>Intern Management</h1>
        <button class="btn btn-primary" onclick="openModal()">+ Add Intern</button>
      </div>

      <div id="pageAlert"></div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by name, university, department...">
        <select id="statusFilter">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
          <option value="completed">Completed</option>
        </select>
        <button class="btn btn-outline" onclick="loadInterns()">Search</button>
      </div>

      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>University</th>
                <th>Department</th>
                <th>Start Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="internsTable">
              <tr><td colspan="7" class="empty-state"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="internModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Intern</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="internForm">
        <div class="modal-body">
          <div id="formAlert"></div>
          <input type="hidden" id="internId">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name *</label>
              <input type="text" id="full_name" required maxlength="150">
            </div>
            <div class="form-group">
              <label>Email *</label>
              <input type="email" id="email" required maxlength="150">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="phone" maxlength="20">
            </div>
            <div class="form-group">
              <label>University</label>
              <input type="text" id="university" maxlength="150">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Department</label>
              <input type="text" id="department" maxlength="150">
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="status">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="completed">Completed</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Start Date *</label>
              <input type="date" id="start_date" required>
            </div>
            <div class="form-group">
              <label>End Date</label>
              <input type="date" id="end_date">
            </div>
          </div>
          <div class="form-row" id="credentialsSection">
            <div class="form-group">
              <label>Username *</label>
              <input type="text" id="username" maxlength="100">
            </div>
            <div class="form-group">
              <label>Password *</label>
              <input type="password" id="password" minlength="6">
            </div>
          </div>
          <div class="form-group">
            <label>Profile Photo</label>
            <input type="file" id="profile_photo" accept="image/*">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    requireAuth('admin');
    document.getElementById('sidebar').innerHTML = renderSidebar('admin', 'interns');
    let editingId = null;

    async function loadInterns() {
      const search = document.getElementById('searchInput').value;
      const status = document.getElementById('statusFilter').value;
      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (status) params.set('status', status);

      try {
        const interns = await apiRequest('/interns?' + params);
        const tbody = document.getElementById('internsTable');
        if (interns.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No interns found</td></tr>';
          return;
        }
        tbody.innerHTML = interns.map(i => `
          <tr>
            <td>${escapeHtml(i.full_name)}</td>
            <td>${escapeHtml(i.email)}</td>
            <td>${escapeHtml(i.university) || '-'}</td>
            <td>${escapeHtml(i.department) || '-'}</td>
            <td>${formatDate(i.start_date)}</td>
            <td><span class="badge badge-${i.status === 'active' ? 'active' : 'inactive'}">${escapeHtml(i.status)}</span></td>
            <td>
              <button class="btn btn-sm btn-outline" data-edit="${i.id}">Edit</button>
              <button class="btn btn-sm btn-danger" data-delete="${i.id}" data-name="${escapeHtml(i.full_name)}">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        showAlert(document.getElementById('pageAlert'), err.message);
      }
    }

    document.getElementById('internsTable').addEventListener('click', (e) => {
      const editBtn = e.target.closest('[data-edit]');
      if (editBtn) return editIntern(editBtn.dataset.edit);
      const deleteBtn = e.target.closest('[data-delete]');
      if (deleteBtn) return deleteIntern(deleteBtn.dataset.delete, deleteBtn.dataset.name);
    });

    function openModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add Intern';
      document.getElementById('internForm').reset();
      document.getElementById('internId').value = '';
      document.getElementById('credentialsSection').classList.remove('hidden');
      document.getElementById('username').required = true;
      document.getElementById('password').required = true;
      document.getElementById('internModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('internModal').classList.remove('active');
    }

    async function editIntern(id) {
      try {
        const intern = await apiRequest('/interns/' + id);
        editingId = id;
        document.getElementById('modalTitle').textContent = 'Edit Intern';
        document.getElementById('internId').value = id;
        document.getElementById('full_name').value = intern.full_name;
        document.getElementById('email').value = intern.email;
        document.getElementById('phone').value = intern.phone || '';
        document.getElementById('university').value = intern.university || '';
        document.getElementById('department').value = intern.department || '';
        document.getElementById('start_date').value = intern.start_date;
        document.getElementById('end_date').value = intern.end_date || '';
        document.getElementById('status').value = intern.status;
        document.getElementById('credentialsSection').classList.add('hidden');
        document.getElementById('username').required = false;
        document.getElementById('password').required = false;
        document.getElementById('internModal').classList.add('active');
      } catch (err) {
        showAlert(document.getElementById('pageAlert'), err.message);
      }
    }

    async function deleteIntern(id, name) {
      if (!confirm('Delete intern "' + name + '"? This cannot be undone.')) return;
      try {
        await apiRequest('/interns/' + id, { method: 'DELETE' });
        loadInterns();
      } catch (err) {
        showAlert(document.getElementById('pageAlert'), err.message);
      }
    }

    document.getElementById('internForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('formAlert');
      const formData = new FormData();
      formData.append('full_name', document.getElementById('full_name').value);
      formData.append('email', document.getElementById('email').value);
      formData.append('phone', document.getElementById('phone').value);
      formData.append('university', document.getElementById('university').value);
      formData.append('department', document.getElementById('department').value);
      formData.append('start_date', document.getElementById('start_date').value);
      formData.append('end_date', document.getElementById('end_date').value);
      formData.append('status', document.getElementById('status').value);

      const photo = document.getElementById('profile_photo').files[0];
      if (photo) formData.append('profile_photo', photo);

      try {
        if (editingId) {
          await apiRequest('/interns/' + editingId, { method: 'PUT', body: formData });
        } else {
          formData.append('username', document.getElementById('username').value);
          formData.append('password', document.getElementById('password').value);
          await apiRequest('/interns', { method: 'POST', body: formData });
        }
        closeModal();
        loadInterns();
      } catch (err) {
        showAlert(alert, err.message);
      }
    });

    document.getElementById('searchInput').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') loadInterns();
    });

    loadInterns();
  </script>
</body>
</html>
