<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6);
      margin-bottom: var(--space-6);
    }
    .dashboard-grid .card-full {
      grid-column: 1 / -1;
    }
    .attendance-overview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
    }
    .attendance-overview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-4);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
    }
    .attendance-overview-item .overview-count {
      font-size: var(--text-2xl);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .attendance-overview-item .overview-label {
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: var(--space-1);
    }
    .activity-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--color-border-light);
    }
    .activity-item:last-child {
      border-bottom: none;
    }
    .activity-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--color-gold-soft);
      margin-top: 6px;
      flex-shrink: 0;
    }
    .activity-dot.success { background: var(--color-success); }
    .activity-dot.warning { background: var(--color-warning); }
    .activity-dot.danger { background: var(--color-danger); }
    .activity-dot.info { background: var(--color-info); }
    .activity-content {
      flex: 1;
      min-width: 0;
    }
    .activity-action {
      font-size: var(--text-sm);
      color: var(--color-ink);
      line-height: 1.4;
    }
    .activity-action strong {
      font-weight: 700;
    }
    .activity-time {
      font-size: var(--text-xs);
      color: var(--color-ink-faint);
      font-family: var(--font-mono);
      margin-top: 2px;
    }
    .pending-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--color-border-light);
    }
    .pending-item:last-child {
      border-bottom: none;
    }
    .pending-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .pending-name {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--color-ink);
    }
    .pending-meta {
      font-size: var(--text-xs);
      color: var(--color-ink-muted);
    }
    @media (max-width: 1024px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 768px) {
      .attendance-overview {
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-2);
      }
      .attendance-overview-item .overview-count {
        font-size: var(--text-xl);
      }
    }
  </style>
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Operations Dashboard</h1>
          <p class="page-subtitle" id="welcomeUser"></p>
        </div>
        <div class="page-header-actions">
          <span class="text-sm text-muted font-mono" id="clock"></span>
        </div>
      </div>

      <div id="dashboardAlert"></div>

      <!-- Quick Stats Row -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-card-accent gold"></div>
          <div class="stat-card-label">Total Interns</div>
          <div class="stat-card-value" id="totalInterns"><div class="spinner"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-accent success"></div>
          <div class="stat-card-label">Active Placements</div>
          <div class="stat-card-value text-success" id="activePlacements"><div class="spinner"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-accent warning"></div>
          <div class="stat-card-label">Pending Applications</div>
          <div class="stat-card-value text-warning" id="pendingApps"><div class="spinner"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-accent danger"></div>
          <div class="stat-card-label">Supervisors</div>
          <div class="stat-card-value text-danger" id="supervisorCount"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Dashboard Grid: 2-column layout -->
      <div class="dashboard-grid">

        <!-- Attendance Overview Panel -->
        <div class="card">
          <div class="card-header">
            <h2>Today's Attendance Overview</h2>
          </div>
          <div class="card-body">
            <div class="attendance-overview" id="attendanceOverview">
              <div class="attendance-overview-item">
                <div class="overview-count text-success" id="presentToday"><div class="spinner"></div></div>
                <div class="overview-label text-muted">Present</div>
              </div>
              <div class="attendance-overview-item">
                <div class="overview-count text-warning" id="lateToday"><div class="spinner"></div></div>
                <div class="overview-label text-muted">Late</div>
              </div>
              <div class="attendance-overview-item">
                <div class="overview-count text-danger" id="absentToday"><div class="spinner"></div></div>
                <div class="overview-label text-muted">Absent</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Pending Actions Panel -->
        <div class="card">
          <div class="card-header">
            <h2>Pending Actions</h2>
            <div class="card-header-actions">
              <a href="/admin/applications.html" class="btn btn-ghost btn-sm">View All</a>
            </div>
          </div>
          <div class="card-body" id="pendingActionsBody">
            <div class="flex items-center justify-between" style="padding: var(--space-3) 0;">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Today's Check-ins Table (full width) -->
        <div class="card card-full">
          <div class="card-header">
            <h2>Today's Check-ins</h2>
            <div class="card-header-actions">
              <a href="/admin/attendance.html" class="btn btn-ghost btn-sm">Full Report</a>
            </div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Department</th>
                  <th>Check-in Time</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="todayCheckins">
                <tr><td colspan="4"><div class="flex items-center justify-between" style="padding: var(--space-6);"><div class="spinner"></div></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Recent Activity Feed (full width) -->
        <div class="card card-full">
          <div class="card-header">
            <h2>Recent Activity</h2>
            <div class="card-header-actions">
              <a href="/admin/audit-logs.html" class="btn btn-ghost btn-sm">View All</a>
            </div>
          </div>
          <div class="card-body" id="recentActivityBody">
            <div class="flex items-center justify-between" style="padding: var(--space-3) 0;">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    const user = requireAuth('admin');
    if (user) {
      document.getElementById('welcomeUser').textContent = 'Welcome back, ' + escapeHtml(user.fullName || user.username);
      document.getElementById('sidebar').innerHTML = renderSidebar('admin', 'dashboard');
    }
    updateClock('clock');

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(String(str)));
      return div.innerHTML;
    }

    function activityDotClass(action) {
      if (!action) return '';
      const a = action.toLowerCase();
      if (a.includes('check-in') || a.includes('checked in') || a.includes('created')) return 'success';
      if (a.includes('check-out') || a.includes('checked out')) return 'info';
      if (a.includes('updated') || a.includes('modified')) return 'warning';
      if (a.includes('deleted') || a.includes('removed')) return 'danger';
      return '';
    }

    function formatActivityDescription(log) {
      const name = log.full_name || log.username || 'System';
      const action = (log.action || '').toLowerCase();
      if (action.includes('check-in') || action.includes('checked in')) {
        return `<strong>${escapeHtml(name)}</strong> checked in for the day`;
      }
      if (action.includes('check-out') || action.includes('checked out')) {
        return `<strong>${escapeHtml(name)}</strong> checked out`;
      }
      if (action.includes('login')) {
        return `<strong>${escapeHtml(name)}</strong> signed in`;
      }
      if (action.includes('application') && action.includes('submit')) {
        return `<strong>${escapeHtml(name)}</strong> submitted a new application`;
      }
      if (action.includes('application') && action.includes('approved')) {
        return `<strong>${escapeHtml(name)}</strong> application was approved`;
      }
      if (action.includes('application') && action.includes('rejected')) {
        return `<strong>${escapeHtml(name)}</strong> application was rejected`;
      }
      if (action.includes('placement')) {
        return `<strong>${escapeHtml(name)}</strong> — placement ${escapeHtml(log.action)}`;
      }
      if (action.includes('created')) {
        return `<strong>${escapeHtml(name)}</strong> ${escapeHtml(log.action)}`;
      }
      if (action.includes('updated')) {
        return `<strong>${escapeHtml(name)}</strong> ${escapeHtml(log.action)}`;
      }
      return `<strong>${escapeHtml(name)}</strong> — ${escapeHtml(log.action)}`;
    }

    function formatActivityTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      const now = new Date();
      const diffMs = now - date;
      const diffMin = Math.floor(diffMs / 60000);
      const diffHr = Math.floor(diffMs / 3600000);
      if (diffMin < 1) return 'Just now';
      if (diffMin < 60) return diffMin + 'm ago';
      if (diffHr < 24) return diffHr + 'h ago';
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
             date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    async function loadDashboard() {
      try {
        const [summary, pendingApps, supervisors, placements, todayAttendance, auditLogs] = await Promise.all([
          apiRequest('/dashboard/summary'),
          apiRequest('/applications?status=pending'),
          apiRequest('/supervisors'),
          apiRequest('/placements?status=open'),
          apiRequest('/attendance/today'),
          apiRequest('/audit-logs?limit=10'),
        ]);

        document.getElementById('totalInterns').textContent = summary.total_interns || 0;
        document.getElementById('activePlacements').textContent = Array.isArray(placements) ? placements.length : 0;
        document.getElementById('pendingApps').textContent = Array.isArray(pendingApps) ? pendingApps.length : 0;
        document.getElementById('supervisorCount').textContent = Array.isArray(supervisors) ? supervisors.length : 0;

        document.getElementById('presentToday').textContent = summary.present_today || 0;
        document.getElementById('lateToday').textContent = summary.late_today || 0;
        document.getElementById('absentToday').textContent = summary.absent_today || 0;

        const todayBody = document.getElementById('todayCheckins');
        if (!Array.isArray(todayAttendance) || todayAttendance.length === 0) {
          todayBody.innerHTML = renderEmptyState('No check-ins recorded today');
        } else {
          todayBody.innerHTML = todayAttendance.map(r => `
            <tr>
              <td class="font-bold">${escapeHtml(r.full_name)}</td>
              <td>${escapeHtml(r.department) || '\u2014'}</td>
              <td class="font-mono">${formatTime(r.check_in)}</td>
              <td>${statusBadge(r.attendance_status)}</td>
            </tr>
          `).join('');
        }

        const pendingBody = document.getElementById('pendingActionsBody');
        if (!Array.isArray(pendingApps) || pendingApps.length === 0) {
          pendingBody.innerHTML = renderEmptyState('No pending applications');
        } else {
          const recentPending = pendingApps.slice(0, 5);
          pendingBody.innerHTML = recentPending.map(app => `
            <div class="pending-item">
              <div class="pending-info">
                <span class="pending-name">${escapeHtml(app.full_name || app.intern_name || 'Unknown')}</span>
                <span class="pending-meta">${escapeHtml(app.department || '')} ${app.submitted_at ? ' — ' + formatDate(app.submitted_at) : ''}</span>
              </div>
              ${statusBadge(app.status)}
            </div>
          `).join('') + (pendingApps.length > 5 ? `<div class="text-sm text-muted" style="margin-top: var(--space-3);">+ ${pendingApps.length - 5} more pending</div>` : '');
        }

        const activityBody = document.getElementById('recentActivityBody');
        if (!Array.isArray(auditLogs) || auditLogs.length === 0) {
          activityBody.innerHTML = renderEmptyState('No recent activity');
        } else {
          activityBody.innerHTML = `
            <ul class="activity-list">
              ${auditLogs.map(log => `
                <li class="activity-item">
                  <div class="activity-dot ${activityDotClass(log.action)}"></div>
                  <div class="activity-content">
                    <div class="activity-action">${formatActivityDescription(log)}</div>
                    <div class="activity-time">${formatActivityTime(log.created_at)}</div>
                  </div>
                </li>
              `).join('')}
            </ul>
          `;
        }
      } catch (err) {
        showAlert(document.getElementById('dashboardAlert'), err.message);
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 60000);
  </script>
</body>
</html>
