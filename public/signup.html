<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Internship — BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .signup-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--surface-warm, #f5f0ea); padding: 2rem; }
    .signup-card { background: #fff; border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 2.5rem; width: 100%; max-width: 480px; }
    .signup-brand { text-align: center; margin-bottom: 2rem; }
    .signup-brand h1 { font-size: 1.5rem; font-weight: 800; color: var(--ink, #1a1a2e); margin-bottom: 0.25rem; }
    .signup-brand p { font-size: 0.85rem; color: var(--ink-muted, #7a7a8e); }
    .signup-brand .ethiopic { font-family: 'Noto Sans Ethiopic', sans-serif; color: var(--gold, #b8860b); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft, #3d3d56); margin-bottom: 0.375rem; }
    .form-group input, .form-group select { width: 100%; padding: 0.625rem 0.875rem; border: 1.5px solid var(--border, #e8e4de); border-radius: 0.5rem; font-size: 0.875rem; font-family: inherit; outline: none; transition: border-color 0.2s; }
    .form-group input:focus, .form-group select:focus { border-color: var(--gold, #b8860b); }
    .form-group input::placeholder { color: #aaa; }
    .btn-signup { width: 100%; padding: 0.75rem; background: var(--gold, #b8860b); color: #fff; border: none; border-radius: 0.5rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
    .btn-signup:hover { background: var(--gold-dark, #8b6508); }
    .btn-signup:disabled { opacity: 0.6; cursor: not-allowed; }
    .signup-footer { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--ink-muted, #7a7a8e); }
    .signup-footer a { color: var(--gold, #b8860b); font-weight: 600; }
    .signup-footer a:hover { text-decoration: underline; }
    .alert { padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.8rem; display: none; }
    .alert-error { background: #fde2e4; color: #9b2226; border: 1px solid #f5c6cb; display: block; }
    .alert-success { background: #d8f3dc; color: #2d6a4f; border: 1px solid #b7e4c7; display: block; }
  </style>
</head>
<body>
  <div class="signup-page">
    <div class="signup-card">
      <div class="signup-brand">
        <h1><span class="ethiopic">መሶብ</span> BG Mesob</h1>
        <p>Apply for an Internship</p>
      </div>

      <div id="alert"></div>

      <form id="signupForm">
        <div class="form-row">
          <div class="form-group">
            <label for="full_name">Full Name *</label>
            <input type="text" id="full_name" name="full_name" required placeholder="e.g. Hana Tesfaye" maxlength="150">
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required placeholder="e.g. hana@university.edu" maxlength="150">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" name="username" required placeholder="Choose a username" minlength="3" maxlength="100">
          </div>
          <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" required placeholder="Min 6 characters" minlength="6" maxlength="255">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" placeholder="+251911000000" maxlength="20">
          </div>
          <div class="form-group">
            <label for="university">University / Organization</label>
            <input type="text" id="university" name="university" placeholder="e.g. Addis Ababa University" maxlength="150">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="department">Department / Field</label>
            <input type="text" id="department" name="department" placeholder="e.g. Software Engineering" maxlength="150">
          </div>
          <div class="form-group">
            <label for="field_of_study">Field of Study</label>
            <input type="text" id="field_of_study" name="field_of_study" placeholder="e.g. Computer Science" maxlength="150">
          </div>
        </div>

        <div class="form-group">
          <label for="cover_letter">Why do you want to intern at MESOB?</label>
          <input type="text" id="cover_letter" name="cover_letter" placeholder="Brief motivation (optional)" maxlength="500">
        </div>

        <button type="submit" class="btn-signup" id="signupBtn">Submit Application</button>
      </form>

      <div class="signup-footer">
        Already have an account? <a href="/login.html">Sign In</a><br>
        <a href="/">← Back to Home</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Auto-redirect if already logged in
    const user = getUser();
    if (user && getToken()) {
      window.location.href = user.role === 'admin' ? '/admin/dashboard.html' : user.role === 'supervisor' ? '/supervisor/dashboard.html' : '/intern/dashboard.html';
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const alertEl = document.getElementById('alert');
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      alertEl.className = 'alert';
      alertEl.style.display = 'none';

      const body = {
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value || undefined,
        university: document.getElementById('university').value || undefined,
        department: document.getElementById('department').value || undefined,
        field_of_study: document.getElementById('field_of_study').value || undefined,
        cover_letter: document.getElementById('cover_letter').value || undefined,
      };

      try {
        const data = await apiRequest('/auth/register', {
          method: 'POST',
          body: JSON.stringify(body),
        });
        alertEl.className = 'alert alert-success';
        alertEl.textContent = data.message || 'Application submitted! Please check your email to verify your account.';
        alertEl.style.display = 'block';
        document.getElementById('signupForm').reset();
        setTimeout(() => { window.location.href = '/login.html'; }, 4000);
      } catch (err) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = err.message;
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit Application';
      }
    });
  </script>
</body>
</html>
