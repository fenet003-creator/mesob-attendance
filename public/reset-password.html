<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .login-footer { margin-top: 1.5rem; text-align: center; }
    .login-footer a { color: var(--gold, #b8860b); font-weight: 600; }
    .login-footer a:hover { text-decoration: underline; }
    .login-footer p { font-size: 0.8rem; color: var(--ink-muted, #7a7a8e); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1>New Password</h1>
        <p>Choose a new password</p>
      </div>
      <div id="alert"></div>
      <form class="login-form" id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="Min 6 characters" maxlength="255">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="Confirm password" maxlength="255">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Reset Password</button>
      </form>
      <div class="login-footer">
        <p><a href="/login">Back to Sign In</a></p>
        <p>&copy; 2026 BG Mesob. All rights reserved.</p>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const alertEl = document.getElementById('alert');
    if (!token) {
      showAlert(alertEl, 'Missing reset token. Please use the link from your email.');
      document.getElementById('resetBtn').disabled = true;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('resetBtn');
      const newPass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (newPass !== confirm) {
        showAlert(alertEl, 'Passwords do not match');
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner spinner-sm"></span> Resetting…';
      try {
        const data = await apiRequest('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, newPassword: newPass })
        });
        showAlert(alertEl, data.message, 'success');
        setTimeout(() => window.location.href = '/login', 2000);
      } catch (err) {
        showAlert(alertEl, err.message);
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
