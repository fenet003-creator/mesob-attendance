<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>My Dashboard</h1>
          <p class="page-subtitle" id="welcomeUser"></p>
        </div>
        <div class="page-header-actions">
          <span class="text-sm text-muted font-mono" id="clock"></span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-accent success"></div>
          <div class="stat-card-label">Present</div>
          <div class="stat-card-value text-success" id="statPresent"><div class="spinner"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-accent warning"></div>
          <div class="stat-card-label">Late</div>
          <div class="stat-card-value text-warning" id="statLate"><div class="spinner"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-accent danger"></div>
          <div class="stat-card-label">Absent</div>
          <div class="stat-card-value text-danger" id="statAbsent"><div class="spinner"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-accent gold"></div>
          <div class="stat-card-label">Attendance Rate</div>
          <div class="stat-card-value text-gold" id="statPercent"><div class="spinner"></div></div>
        </div>
      </div>

      <div id="dashAlert"></div>

      <div class="card">
        <div class="card-header">
          <h2>Today's Attendance</h2>
        </div>
        <div class="checkin-panel">
          <div class="checkin-clock" id="checkinClock">--:--</div>
          <div class="checkin-date" id="checkinDate"></div>
          <div id="todayStatus" class="checkin-status mb-6"></div>
          <div id="alert"></div>
          <div class="checkin-actions">
            <button class="btn btn-success" id="checkInBtn" onclick="checkIn()" style="min-width:140px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg>
              Check In
            </button>
            <button class="btn btn-danger" id="checkOutBtn" onclick="checkOut()" style="min-width:140px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Check Out
            </button>
          </div>
          <div class="checkin-rules">
            Present: before 8:15 AM &nbsp;&middot;&nbsp; Late: 8:15 – 8:30 AM &nbsp;&middot;&nbsp; Absent: after 8:30 AM
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    const user = requireAuth('intern');
    if (user) {
      document.getElementById('welcomeUser').textContent = 'Welcome back, ' + escapeHtml(user.fullName || user.username);
      document.getElementById('sidebar').innerHTML = renderSidebar('intern', 'dashboard');
    }

    function updateCheckinClock() {
      const now = new Date();
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      document.getElementById('checkinClock').textContent = `${h12}:${m}:${s} ${ampm}`;
      document.getElementById('checkinDate').textContent = now.toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      });
    }
    updateCheckinClock();
    setInterval(updateCheckinClock, 1000);

    async function loadStats() {
      try {
        const stats = await apiRequest('/attendance/stats');
        document.getElementById('statPresent').textContent = stats.present;
        document.getElementById('statLate').textContent = stats.late;
        document.getElementById('statAbsent').textContent = stats.absent;
        document.getElementById('statPercent').textContent = stats.attendance_percentage + '%';
      } catch (err) {
        showAlert(document.getElementById('dashAlert'), err.message);
      }
    }

    async function loadTodayStatus() {
      try {
        const records = await apiRequest('/attendance/today');
        const statusEl = document.getElementById('todayStatus');
        const checkInBtn = document.getElementById('checkInBtn');
        const checkOutBtn = document.getElementById('checkOutBtn');

        if (records.length === 0) {
          statusEl.innerHTML = '<span class="badge badge-absent">Not checked in yet</span>';
          checkInBtn.disabled = false;
          checkOutBtn.disabled = true;
          return;
        }

        const r = records[0];
        statusEl.innerHTML = `
          <div style="display:flex;gap:var(--space-6);align-items:center;justify-content:center;flex-wrap:wrap;">
            <div class="text-sm"><span class="text-muted">Check In:</span> <strong class="font-mono">${formatTime(r.check_in)}</strong></div>
            <div class="text-sm"><span class="text-muted">Check Out:</span> <strong class="font-mono">${formatTime(r.check_out)}</strong></div>
            <div>${statusBadge(r.attendance_status)}</div>
          </div>
        `;
        checkInBtn.disabled = !!r.check_in;
        checkOutBtn.disabled = !r.check_in || !!r.check_out;
      } catch (err) {
        showAlert(document.getElementById('dashAlert'), err.message);
      }
    }

    async function checkIn() {
      const alertEl = document.getElementById('alert');
      try {
        const result = await apiRequest('/attendance/check-in', { method: 'POST' });
        showAlert(alertEl, 'Checked in \u2014 Status: ' + escapeHtml(result.status), 'success');
        loadTodayStatus();
        loadStats();
      } catch (err) {
        showAlert(alertEl, err.message);
      }
    }

    async function checkOut() {
      const alertEl = document.getElementById('alert');
      try {
        await apiRequest('/attendance/check-out', { method: 'POST' });
        showAlert(alertEl, 'Checked out successfully', 'success');
        loadTodayStatus();
      } catch (err) {
        showAlert(alertEl, err.message);
      }
    }

    loadStats();
    loadTodayStatus();
  </script>
</body>
</html>
