<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>My Profile</h1>
          <p class="page-subtitle">View your account information</p>
        </div>
      </div>

      <div id="pageAlert"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);max-width:960px;">
        <div class="card">
          <div class="card-header">
            <h2>Personal Information</h2>
          </div>
          <div class="card-body">
            <div id="profileContent">
              <div class="empty-state"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Change Password</h2>
          </div>
          <div class="card-body">
            <p class="text-sm text-muted mb-6">Update your account password.</p>
            <div id="alert"></div>
            <form id="passwordForm">
              <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currentPassword" required placeholder="Enter current password">
              </div>
              <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="Enter new password">
                <div class="form-hint">Minimum 6 characters</div>
              </div>
              <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Confirm new password">
              </div>
              <button type="submit" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Update Password
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    const user = requireAuth('intern');
    if (user) {
      document.getElementById('sidebar').innerHTML = renderSidebar('intern', 'profile');
    }

    async function loadProfile() {
      try {
        const profile = await apiRequest('/auth/me');
        const intern = profile.intern;
        const container = document.getElementById('profileContent');

        if (!intern) {
          container.innerHTML = '<div class="empty-state"><h3>Profile not found</h3></div>';
          return;
        }

        const photo = intern.profile_photo
          ? `<img src="${escapeHtml(intern.profile_photo)}" class="profile-photo-lg" alt="Profile photo">`
          : `<div class="profile-avatar-placeholder">${escapeHtml(intern.full_name.charAt(0).toUpperCase())}</div>`;

        const fields = [
          ['Email', intern.email],
          ['Phone', intern.phone],
          ['University', intern.university],
          ['Department', intern.department],
          ['Start Date', intern.start_date],
          ['End Date', intern.end_date],
          ['Username', profile.username],
        ];

        const fieldsHtml = fields.map(([label, value]) => `
          <div style="display:flex;justify-content:space-between;padding:var(--space-3) 0;border-bottom:1px solid var(--color-border-light);">
            <span class="text-sm text-muted">${escapeHtml(label)}</span>
            <span class="text-sm font-bold">${escapeHtml(value) || '\u2014'}</span>
          </div>
        `).join('');

        container.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:var(--space-6);">
            ${photo}
            <h2 style="margin-top:var(--space-4);">${escapeHtml(intern.full_name)}</h2>
            <span class="badge badge-${intern.status === 'active' ? 'active' : intern.status === 'completed' ? 'completed' : 'inactive'}" style="margin-top:var(--space-2);">${escapeHtml(intern.status)}</span>
          </div>
          ${fieldsHtml}
        `;
      } catch (err) {
        showAlert(document.getElementById('pageAlert'), err.message);
      }
    }

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      const newPass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (newPass !== confirm) {
        showAlert(alertEl, 'Passwords do not match');
        return;
      }

      try {
        await apiRequest('/auth/change-password', {
          method: 'POST',
          body: JSON.stringify({
            currentPassword: document.getElementById('currentPassword').value,
            newPassword: newPass,
          }),
        });
        showAlert(alertEl, 'Password updated successfully', 'success');
        document.getElementById('passwordForm').reset();
      } catch (err) {
        showAlert(alertEl, err.message);
      }
    });

    loadProfile();
  </script>
</body>
</html>
