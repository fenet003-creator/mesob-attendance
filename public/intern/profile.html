<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h1>My Profile</h1>
      </div>

      <div id="pageAlert"></div>

      <div class="card" style="max-width: 560px;">
        <div id="profileContent">
          <p class="empty-state"><div class="spinner"></div></p>
        </div>
      </div>

      <div class="card" style="max-width: 560px;">
        <h2>Change Password</h2>
        <div id="alert"></div>
        <form id="passwordForm">
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="currentPassword" required>
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" required minlength="6">
            <small style="color: var(--gray-500);">Minimum 6 characters</small>
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const user = requireAuth('intern');
    document.getElementById('sidebar').innerHTML = renderSidebar('intern', 'profile');

    async function loadProfile() {
      try {
        const profile = await apiRequest('/auth/me');
        const intern = profile.intern;
        const container = document.getElementById('profileContent');

        if (!intern) {
          container.innerHTML = '<p class="empty-state">Profile not found</p>';
          return;
        }

        const photo = intern.profile_photo
          ? '<img src="' + escapeHtml(intern.profile_photo) + '" class="profile-photo-lg" alt="Profile">'
          : '<div class="profile-photo-lg" style="background: var(--gray-200); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--gray-500);">' + escapeHtml(intern.full_name.charAt(0)) + '</div>';

        container.innerHTML = `
          ${photo}
          <h2 style="text-align: center; margin-bottom: 1.5rem;">${escapeHtml(intern.full_name)}</h2>
          <table style="width: 100%;">
            <tr><td style="padding: 0.5rem 0; color: var(--gray-500);">Email</td><td>${escapeHtml(intern.email)}</td></tr>
            <tr><td style="padding: 0.5rem 0; color: var(--gray-500);">Phone</td><td>${escapeHtml(intern.phone) || '-'}</td></tr>
            <tr><td style="padding: 0.5rem 0; color: var(--gray-500);">University</td><td>${escapeHtml(intern.university) || '-'}</td></tr>
            <tr><td style="padding: 0.5rem 0; color: var(--gray-500);">Department</td><td>${escapeHtml(intern.department) || '-'}</td></tr>
            <tr><td style="padding: 0.5rem 0; color: var(--gray-500);">Start Date</td><td>${formatDate(intern.start_date)}</td></tr>
            <tr><td style="padding: 0.5rem 0; color: var(--gray-500);">End Date</td><td>${formatDate(intern.end_date)}</td></tr>
            <tr><td style="padding: 0.5rem 0; color: var(--gray-500);">Status</td><td><span class="badge badge-${intern.status === 'active' ? 'active' : 'inactive'}">${escapeHtml(intern.status)}</span></td></tr>
            <tr><td style="padding: 0.5rem 0; color: var(--gray-500);">Username</td><td>${escapeHtml(profile.username)}</td></tr>
          </table>
        `;
      } catch (err) {
        showAlert(document.getElementById('pageAlert'), err.message);
      }
    }

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      const newPass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (newPass !== confirm) {
        showAlert(alert, 'Passwords do not match');
        return;
      }

      try {
        await apiRequest('/auth/change-password', {
          method: 'POST',
          body: JSON.stringify({
            currentPassword: document.getElementById('currentPassword').value,
            newPassword: newPass,
          }),
        });
        showAlert(alert, 'Password updated successfully', 'success');
        document.getElementById('passwordForm').reset();
      } catch (err) {
        showAlert(alert, err.message);
      }
    });

    loadProfile();
  </script>
</body>
</html>
