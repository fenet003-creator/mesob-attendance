<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisor Dashboard — BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Supervisor Dashboard</h1>
          <p class="page-subtitle" id="welcomeUser"></p>
        </div>
        <div class="page-header-actions">
          <span class="text-sm text-muted font-mono" id="clock"></span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-accent success"></div>
          <div class="stat-card-label">My Interns</div>
          <div class="stat-card-value" id="statInterns"><div class="spinner"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-accent warning"></div>
          <div class="stat-card-label">Present Today</div>
          <div class="stat-card-value text-success" id="statPresent"><div class="spinner"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-accent danger"></div>
          <div class="stat-card-label">Late Today</div>
          <div class="stat-card-value text-warning" id="statLate"><div class="spinner"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-accent gold"></div>
          <div class="stat-card-label">Absent Today</div>
          <div class="stat-card-value text-danger" id="statAbsent"><div class="spinner"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>My Interns</h2>
        </div>
        <div class="card-body">
          <div id="internList"><div class="spinner"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Recent Announcements</h2>
        </div>
        <div class="card-body">
          <div id="announcementList"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    const user = requireAuth('supervisor');
    if (!user) throw new Error('Not authorized');

    document.getElementById('sidebar').innerHTML = renderSidebar('supervisor', 'dashboard');
    document.getElementById('welcomeUser').textContent = `Welcome, ${escapeHtml(user.fullName || user.username)}`;

    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }
    updateClock();
    setInterval(updateClock, 60000);

    // Load data
    async function loadData() {
      try {
        // Get assigned interns
        const interns = await apiRequest('/supervisors/interns');
        document.getElementById('statInterns').textContent = interns.length || 0;

        // Get today's attendance
        const today = new Date().toISOString().slice(0, 10);
        const todayRecords = await apiRequest(`/attendance/date/${today}`);
        let present = 0, late = 0, absent = 0;
        todayRecords.forEach(r => {
          if (r.attendance_status === 'present') present++;
          else if (r.attendance_status === 'late') late++;
          else absent++;
        });
        document.getElementById('statPresent').textContent = present;
        document.getElementById('statLate').textContent = late;
        document.getElementById('statAbsent').textContent = absent;

        // Render intern list
        if (interns.length === 0) {
          document.getElementById('internList').innerHTML = '<p class="text-muted">No interns assigned yet.</p>';
        } else {
          document.getElementById('internList').innerHTML = interns.map(i => `
            <div class="table-row">
              <div><strong>${escapeHtml(i.full_name)}</strong><br><small class="text-muted">${escapeHtml(i.department || '')} | ${escapeHtml(i.status)}</small></div>
            </div>
          `).join('');
        }

        // Load announcements
        const announcements = await apiRequest('/announcements/active');
        if (announcements.length === 0) {
          document.getElementById('announcementList').innerHTML = '<p class="text-muted">No announcements.</p>';
        } else {
          document.getElementById('announcementList').innerHTML = announcements.slice(0, 3).map(a => `
            <div class="table-row">
              <div><strong>${escapeHtml(a.title)}</strong><br><small class="text-muted">${escapeHtml(a.content).slice(0, 100)}...</small></div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Load error:', err);
      }
    }

    loadData();
  </script>
</body>
</html>
