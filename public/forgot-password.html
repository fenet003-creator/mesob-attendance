<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — BG Mesob</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .login-footer { margin-top: 1.5rem; text-align: center; }
    .login-footer a { color: var(--gold, #b8860b); font-weight: 600; }
    .login-footer a:hover { text-decoration: underline; }
    .login-footer p { font-size: 0.8rem; color: var(--ink-muted, #7a7a8e); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <h1>Reset Password</h1>
        <p>Enter your email or username</p>
      </div>
      <div id="alert"></div>
      <form class="login-form" id="forgotForm">
        <div class="form-group">
          <label for="identifier">Email or Username</label>
          <input type="text" id="identifier" required placeholder="e.g. hana_t or hana@university.edu" maxlength="150">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">Send Reset Link</button>
      </form>
      <div class="login-footer">
        <p><a href="/login">Back to Sign In</a></p>
        <p>&copy; 2026 BG Mesob. All rights reserved.</p>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgotBtn');
      const alertEl = document.getElementById('alert');
      const val = document.getElementById('identifier').value.trim();
      if (!val) return;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner spinner-sm"></span> Sending…';
      try {
        const payload = val.includes('@') ? { email: val } : { username: val };
        const data = await apiRequest('/auth/forgot-password', { method: 'POST', body: JSON.stringify(payload) });
        showAlert(alertEl, data.message, 'success');
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      } catch (err) {
        showAlert(alertEl, err.message);
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
